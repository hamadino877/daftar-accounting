<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103c34"><title>دفتر | حسابات ومخزون</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">د</div><div><strong>دفتر</strong><small>الحسابات والمخزون</small></div></div><nav id="nav"><button class="nav active" data-view="dashboard">▦ <span>الرئيسية</span></button><button class="nav" data-view="products">▣ <span>المنتجات والمخزون</span></button><button class="nav" data-view="customers">♙ <span>العملاء</span></button><button class="nav" data-view="suppliers">♧ <span>الموردين</span></button><button class="nav" data-view="sales">▤ <span>فواتير البيع</span></button><button class="nav" data-view="purchases">▧ <span>فواتير الشراء</span></button><button class="nav" data-view="returns">↶ <span>المرتجعات</span></button><button class="nav" data-view="cash">◉ <span>الخزنة والمصروفات</span></button><button class="nav" data-view="reports">▥ <span>التقارير</span></button></nav><div class="sidefoot">نسخة محلية · بياناتك على هذا الجهاز</div></aside>
<main class="main"><header class="topbar"><div><div class="eyebrow">نظام إدارة مالي بسيط وعملي</div><h1 id="pageTitle">لوحة التحكم</h1></div><div class="top-actions"><button class="btn ghost" id="exportBtn">⬇ نسخة احتياطية</button><button class="btn ghost" id="importBtn">⬆ استعادة نسخة</button><span id="cloudStatus" class="cloud-status">سحابة غير مهيأة</span><button class="btn ghost hidden" id="logoutBtn">تسجيل خروج</button><button class="btn primary" id="quickAdd">＋ إضافة جديدة</button></div></header><section id="content"></section></main></div>
<div id="modalWrap" class="modal-wrap hidden"><div class="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button class="close" id="closeModal">×</button></div><div id="modalBody"></div><div class="modal-actions"><button class="btn ghost" id="cancelModal">إلغاء</button><button class="btn primary" id="saveModal">حفظ</button></div></div></div><input type="file" id="importFile" accept="application/json" hidden><div id="toast" class="toast"></div><div id="authRoot" class="auth-root hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="cloud-config.js"></script><script src="app.js"></script></body></html>
